name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python files
        run: python -m py_compile money_bot.py trends.py video_prompts.py meme_renderer.py
      - name: Validate JSON files
        run: python -m json.tool config.json >/dev/null && python -m json.tool scenes/example_uneet_monday.json >/dev/null
